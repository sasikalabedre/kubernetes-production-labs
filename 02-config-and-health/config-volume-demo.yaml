apiVersion: v1
kind: Pod
metadata:
  name: config-volume-demo
  namespace: production-labs
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: app-config-volume
          mountPath: /etc/myapp
          readOnly: true
  volumes:
    - name: app-config-volume
      configMap:
        name: app-file-config
