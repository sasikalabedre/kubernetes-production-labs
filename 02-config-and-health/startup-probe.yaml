apiVersion: v1
kind: Pod
metadata:
  name: startup-probe-demo
  namespace: production-labs
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 12
