
apiVersion: v1
kind: Pod
metadata:
  name: cpu-load-test
  namespace: production-labs
spec:
  restartPolicy: Never
  containers:
    - name: cpu-burner
      image: busybox:1.36
      command:
        - sh
        - -c
        - "while true; do :; done"
      resources:
        requests:
          cpu: "100m"
          memory: "16Mi"
        limits:
          cpu: "200m"
          memory: "32Mi"
