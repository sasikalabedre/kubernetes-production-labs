apiVersion: v1
kind: Pod
metadata:
  name: taint-test-pod
  namespace: production-labs
spec:
  tolerations:
    - key: "team"
      operator: "Equal"
      value: "database"
      effect: "NoSchedule"
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
