
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-throttling-demo
  namespace: production-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-throttling-demo
  template:
    metadata:
      labels:
        app: cpu-throttling-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
