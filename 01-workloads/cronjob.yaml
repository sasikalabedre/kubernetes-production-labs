apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: production-labs
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: hello-cronjob
        spec:
          containers:
            - name: hello
              image: busybox:1.36
              command:
                - sh
                - -c
                - 'date; echo "Hello from Kubernetes CronJob"'
          restartPolicy: Never
