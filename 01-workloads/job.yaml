apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
  namespace: production-labs
spec:
  template:
    metadata:
      labels:
        app: hello-job
    spec:
      containers:
        - name: hello
          image: busybox:1.36
          command: ["sh", "-c", "echo Hello from Kubernetes Job"]
      restartPolicy: Never
  backoffLimit: 2
