apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-monitor
  namespace: production-labs
spec:
  selector:
    matchLabels:
      app: node-monitor
  template:
    metadata:
      labels:
        app: node-monitor
    spec:
      containers:
        - name: monitor
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo Node monitoring agent running; sleep 30; done"]
