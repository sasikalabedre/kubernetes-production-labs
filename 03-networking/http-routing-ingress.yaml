apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-routing-ingress
  namespace: production-labs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: routing.local
      http:
        paths:
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: clusterip-demo-svc
                port:
                  number: 80
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80
