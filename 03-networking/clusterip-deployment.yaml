apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterip-demo
  namespace: production-labs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clusterip-demo
  template:
    metadata:
      labels:
        app: clusterip-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
