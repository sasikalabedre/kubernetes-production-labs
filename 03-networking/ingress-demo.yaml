apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: networking-demo
  namespace: production-labs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - networking-demo.local
      secretName: networking-demo-tls
  rules:
    - host: networking-demo.local
      http:
        paths:
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: clusterip-demo-svc
                port:
                  number: 80
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80
